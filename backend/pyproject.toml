[project]
name = "trade-management-backend"
version = "0.1.0"
description = "Trade management backend (Django + django-ninja)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6",
    "django-ninja>=1.4",
    "django-allauth[socialaccount]>=65.9",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.9",
    "gunicorn>=23",
    "httpx>=0.27",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
